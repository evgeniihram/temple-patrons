name: Daily Patrons

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build daily.json
        run: |
          python3 - <<'PY'
          import json, datetime, pathlib

          base = pathlib.Path('.')
          with open(base / 'patrons.json', encoding='utf-8') as f:
              data = json.load(f)

          today = datetime.date.today()
          key = today.strftime('%m-%d')
          todays = [p for p in data['patrons'] if key in p['feastDays']]

          out = {
              'date': today.isoformat(),
              'patrons': todays,
          }

          with open(base / 'daily.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print('today:', today.isoformat(), 'matched:', len(todays))
          PY

      - name: Commit and push
        run: |
          git config user.name "temple-patrons-bot"
          git config user.email "bot@users.noreply.github.com"
          git add daily.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "daily update $(date -u +%Y-%m-%d)"
            git push
          fi